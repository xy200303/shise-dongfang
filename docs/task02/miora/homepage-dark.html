<body class="bg-dark text-cream font-body antialiased">

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://fonts.googleapis.cn/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" />

<style type="text/tailwindcss">
  @theme {
    --color-dark: #141310;
    --color-dark-surface: #1C1B17;
    --color-dark-elevated: #222119;
    --color-cream: #FAF8F4;
    --color-cream-dim: #C8C4BA;
    --color-cream-muted: #7A776E;
    --color-divider-dark: #2A2825;
    --color-cinnabar: #C8473F;
    --color-cinnabar-glow: #D4655E;
    --font-display: 'Noto Serif SC', 'Songti SC', serif;
    --font-body: 'Noto Sans SC', 'PingFang SC', sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
  }
</style>

<style>
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 256px 256px;
  }

  .color-card {
    transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.3s ease;
  }
  .color-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
  }

  .nav-link {
    position: relative;
  }
  .nav-link::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 0;
    height: 1px;
    background: #FAF8F4;
    transition: width 0.3s ease;
  }
  .nav-link:hover::after {
    width: 100%;
  }

  .season-btn {
    transition: color 0.25s ease, border-color 0.25s ease;
  }
  .season-btn:hover {
    color: #C8473F;
    border-color: #C8473F;
  }

  .filter-tag {
    transition: color 0.2s ease;
  }
  .filter-tag:hover {
    color: #C8473F;
  }
  .filter-tag.active {
    color: #C8473F;
    border-bottom: 1px solid #C8473F;
  }
</style>
